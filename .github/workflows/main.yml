name: 🎭 Run Playwright Tests
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        id: playwright
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation/playwright-report

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: automation/test-results

      - name: Notify n8n
        if: always()
        run: |
          ERROR_FILE=$(find automation/test-results -name "error-context.md" | head -1)
          if [ -z "$ERROR_FILE" ]; then
            ERROR_FILE=/dev/null
          fi

          JSON_PAYLOAD=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg status "${{ job.status }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg branch "${{ github.head_ref || github.ref_name }}" \
            --rawfile log_data "$ERROR_FILE" \
            '{
              repository: $repo,
              status: $status,
              run_id: $run_id,
              branch: $branch,
              playWrightLogs: $log_data
            }')

          curl -X POST -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            https://pranavpatil241.app.n8n.cloud/workflow/M89kcZDHOydBewcR?projectId=7TmF978weCNqFf5y
